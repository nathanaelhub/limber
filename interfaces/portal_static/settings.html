<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0E6B64">
  <link rel="icon" href="/static/favicon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Limber">
  <link rel="stylesheet" href="/static/portal.css">
  <title>Limber · Settings</title>
</head>
<body data-page="settings">
  <header class="bar">
    <a class="brand" href="/today"><img src="/static/limber-mark.svg" alt="" width="36" height="36"><span>Limber</span></a>
    <nav class="tabs" aria-label="Main"><a href="/today"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span>Today</span></a><a href="/progress"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20v-6M12 20V6M19 20v-10"/></svg><span>Progress</span></a><a id="nav-messages" href="/messages" hidden><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"/></svg><span>Messages</span><span id="nav-unread" class="badge" hidden></span></a><a href="/visits"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Visits</span></a><a href="/settings" aria-current="page"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>Settings</span></a></nav>
    <span class="who"><span id="patient-id"></span><button id="signout" class="link" type="button">Sign out</button></span>
  </header>
  <main class="card wide">
    <h1>Settings</h1>
    <p class="lead">Make Limber easier to read and use. These follow you to every device you sign in on.</p>
    <form id="prefs">
      <label class="check"><input type="checkbox" id="larger_text"> Larger text</label>
      <label class="check"><input type="checkbox" id="high_contrast"> Higher contrast</label>
      <label class="check"><input type="checkbox" id="reduced_motion"> Less motion</label>
      <button type="submit">Save</button>
      <p id="saved" class="small" role="status" hidden>Saved.</p>
      <p id="prefs-error" class="error" role="alert" hidden></p>
    </form>
    <section id="assistant-notice" class="notice" hidden>
      <h2>How your records are used</h2>
      <div id="assistant-notices"></div>
    </section>
  </main>
  <script src="/static/portal.js"></script>
</body>
</html>
