<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0E6B64">
  <link rel="icon" href="/static/favicon.png">
  <link rel="stylesheet" href="/static/portal.css">
  <title>Limber · Today</title>
</head>
<body data-page="today">
  <header class="bar">
    <a class="brand" href="/today"><img src="/static/limber-mark.svg" alt="" width="36" height="36"><span>Limber</span></a>
    <nav><a href="/today" aria-current="page">Today</a><a href="/progress">Progress</a><a id="nav-messages" href="/messages" hidden>Messages<span id="nav-unread" class="badge" hidden></span></a></nav>
    <span class="who"><span id="patient-id"></span><button id="signout" class="link" type="button">Sign out</button></span>
  </header>
  <main class="card wide">
    <h1>Today's plan</h1>
    <p id="program-name" class="lead"></p>
    <p id="message" class="lead" hidden></p>
    <div id="plan" hidden>
      <div class="track" role="progressbar" aria-valuemin="0" id="bar"><span id="bar-fill"></span></div>
      <p id="complete" class="muted"></p>
    </div>
    <ol id="exercises" class="exercises"></ol>
    <ul id="notes" class="small"></ul>
    <a id="start" class="button" href="/session" hidden>Start today's session</a>
    <div id="week" class="stats" hidden>
      <div><span id="week-done" class="big"></span><span class="unit">sessions this week</span></div>
      <div><span id="streak" class="big"></span><span class="unit">week streak</span></div>
    </div>
  </main>
  <script src="/static/portal.js"></script>
</body>
</html>
