name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: System libraries for OpenCV and PyAV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Install dependencies (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Run the test suite
        env:
          LIMBER_ANTHROPIC_API_KEY: ""
        run: python -m pytest -q
      - name: Run the record, portal, AI and deploy tests again on libSQL (feature 020)
        env:
          LIMBER_ANTHROPIC_API_KEY: ""
          LIMBER_DB_BACKEND: libsql
        run: python -m pytest -q tests/test_ptlog*.py tests/test_portal*.py tests/test_assist.py tests/test_deploy*.py tests/test_hosted_settings.py tests/test_media_files.py
