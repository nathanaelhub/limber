# Limber brand theme for the therapist app (colors from the brand sheets).
[theme]
base = "light"
primaryColor = "#0E6B64"
backgroundColor = "#FAF8F4"
secondaryBackgroundColor = "#F1EEE7"
textColor = "#16302C"
font = "sans serif"
baseRadius = "14px"

# No Deploy button or developer menu in the clinic (the design shows none).
[client]
toolbarMode = "minimal"
